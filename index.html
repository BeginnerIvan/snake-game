<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Змейка</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <h1>Змейка</h1>
    <div class="hud">
      <span>Счёт: <b id="score">0</b></span>
      <span>Рекорд: <b id="best">0</b></span>
      <button id="mute" class="mute" title="Звук вкл/выкл">🔊</button>
    </div>
    <canvas id="board" width="400" height="400"></canvas>
    <p class="hint">Управление — стрелки или WASD. Пробел — пауза.</p>
    <div id="overlay" class="overlay hidden">
      <p id="overlay-text">Игра окончена</p>
      <button id="restart">Заново</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
